[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fnb-data-platform"
version = "0.1.0"
description = "Minimal F&B data engineering workspace"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "pyarrow==23.0.1", "shapely==2.1.2"]

[project.optional-dependencies]
download = ["overturemaps==1.0.2"]
test = ["pytest==9.1.1", "httpx==0.28.1", "beautifulsoup4==4.15.0", "duckdb==1.5.5", "playwright==1.42.0", "selenium==4.49.0", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fnb_platform = ["osm_fnb_mapping.v1.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/test_catalog.py", "tests/test_categories.py", "tests/test_prepare_catalog.py", "tests/test_osm.py"]
