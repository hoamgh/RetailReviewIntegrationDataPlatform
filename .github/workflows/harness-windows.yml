name: Harness Windows Quality Gate

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline:
    name: Windows offline regression (Python 3.12.7)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: false

      - name: Set up audited Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.7"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/ci-windows.in
            requirements/ci-windows.txt

      - name: Set up audited Node for offline DOM tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.11.0"
          check-latest: false

      - name: Install hash-locked CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate gate and workflow contracts
        run: |
          python -B -m pytest -q --import-mode=importlib -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/ci-contract-tests" tests/test_ci_windows_quality_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all required offline regressions
        id: regression
        run: |
          python -B scripts/ci/windows_quality_gate.py --reports "$env:RUNNER_TEMP/harness-ci-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish timing summary
        if: ${{ always() }}
        run: |
          $summary = "$env:RUNNER_TEMP/harness-ci-reports/summary.md"
          if (Test-Path -LiteralPath $summary) {
            Get-Content -Raw -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload sanitized failure reports only
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: harness-windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-ci-reports/junit.xml
            ${{ runner.temp }}/harness-ci-reports/summary.json
            ${{ runner.temp }}/harness-ci-reports/summary.md
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
